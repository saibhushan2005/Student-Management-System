
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        form {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #5b4bc4;
            margin-bottom: 25px;
            font-size: 27px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            margin-bottom: 17px;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #667eea;
            box-shadow: 0 0 6px rgba(102,126,234,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        @media (max-width: 450px) {
            form {
                width: 100%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <form action="/student/edit/{{std[0]}}" method="post">

        <h1>🎓 Update Student</h1>

        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter student name" required value={{std[1]}}>

        <label>Age:</label>
        <input type="number" name="age" placeholder="Enter age" required value={{std[2]}}>

        <label>Gender:</label>
        <input type="text" name="gender" placeholder="Enter gender" required value={{std[3]}}>

        <label>Marks:</label>
        <input type="number" name="marks" placeholder="Enter marks" required value={{std[4]}}>

        <label>Course:</label>
        <input type="text" name="course" placeholder="Enter course name" required value={{std[5]}}>

        <label>Image:</label>
        <input type="text" name="image" placeholder="Enter image URL" value={{std[6]}}>

        <label>Status:</label>
        <select name="status" required>
            <option value="">Select</option>
            <option value="1">Present</option>
            <option value="0">Absent</option>
        </select>

        <button type="submit">Update</button>

    </form>

</body>
</html>
