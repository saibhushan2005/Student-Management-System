
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Absent Students</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        /* Back Button */
        .back-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-block;
            background: white;
            color: #764ba2;
            padding: 10px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #eee;
        }

        /* Student Container */
        .student-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        /* Student Card */
        .card {
            background: white;
            width: 250px;
            min-height: 380px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .card p {
            background: #f3f4f6;
            padding: 8px;
            margin: 7px 0;
            border-radius: 5px;
            text-align: left;
            font-size: 14px;
        }

        /* Absent Status */
        .absent-text {
            color: #dc2626;
            font-weight: bold;
        }

        /* Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .buttons a {
            padding: 8px 12px;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-size: 12px;
        }

        .view-btn {
            background: #2563eb;
        }

        .update-btn {
            background: #e99920;
        }

        /* Empty Message */
        .empty {
            text-align: center;
            color: white;
            font-size: 18px;
            margin-top: 30px;
            width: 100%;
        }

        @media(max-width: 600px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <h1>❌ Absent Students</h1>

    <!-- Back Button -->
    <div class="back-container">
        <a href="/" class="back-btn">← Back to Dashboard</a>
    </div>

    <!-- Student Details -->
    <div class="student-container">

        {% for std in stds %}

        <div class="card">

            <img src="{{ std[6] }}" alt="Student Image">

            <p><b>Name:</b> {{ std[1] }}</p>
            <p><b>Age:</b> {{ std[2] }}</p>
            <p><b>Gender:</b> {{ std[3] }}</p>
            <p><b>Marks:</b> {{ std[4] }}</p>
            <p><b>Course:</b> {{ std[5] }}</p>

            <p>
                <b>Status:</b>
                <span class="absent-text">Absent</span>
            </p>

            <div class="buttons">

                <a href="/student/{{ std[0] }}" class="view-btn">
                    View
                </a>

                <a href="/student/edit/{{ std[0] }}" class="update-btn">
                    Update
                </a>

            </div>

        </div>

        {% else %}

        <p class="empty">No Absent Students Found!</p>

        {% endfor %}

    </div>

</body>
</html>
